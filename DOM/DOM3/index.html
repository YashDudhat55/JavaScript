<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">    <title>DOM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <button id="myButton">Click Me</button>
    <button id="doubleClickButton">Double Click Me</button>

    <div class="parent">
        <div class="counter">
            <h2>Counter App</h2>

            <div class="counter-main">
                <button id="increment"><i class="fa-solid fa-plus"></i></button>
                <p id="count">0</p>
                <button id="decrement"><i class="fa-solid fa-minus"></i></button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
