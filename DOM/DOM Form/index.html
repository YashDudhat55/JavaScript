<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page-wrapper">

        <div class="registration-card">

            <div class="form-header">
                <div class="icon-circle">
                    🎓
                </div>

                <h1>Student Registration</h1>
            </div>


            <div class="form-body">

                <form id="student_Form">

                    <div class="mb-4">
                        <label for="full_name" class="form-label">
                            Full Name
                        </label>

                        <input type="text" class="form-control" id="full_name" placeholder="Enter your full name">
                        <span id="fullNameError" class="error"></span>
                    </div>

                    <div class="mb-4">

                        <label for="email" class="form-label">
                                Email Address
                            </label>

                        <input type="email" class="form-control" id="email" placeholder="Enter your email">
                        <span id="emailError" class="error"></span>
                    </div>

                    <div class="mb-4">

                        <label for="password" class="form-label">
                                Password
                            </label>

                        <input type="password" class="form-control" id="password" placeholder="Enter password">
                        <span id="passwordError" class="error"></span>
                    </div>

                    <div class="mb-4">

                        <label for="mobile" class="form-label">
                                Mobile Number
                            </label>

                        <input type="tel" class="form-control" id="mobile" placeholder="Enter mobile number">
                        <span id="mobileError" class="error"></span>
                    </div>

                    <div class="mb-4">

                        <label for="date" class="form-label">
                                Birth Date
                            </label>

                        <input type="date" class="form-control" id="birth_date" placeholder="Enter your age">
                        <span id="dobError" class="error"></span>
                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Gender
                        </label>

                        <div class="option-box">

                            <div class="form-check form-check-inline">

                                <input class="form-check-input" type="radio" name="gender" id="gender" value="Male">

                                <label class="form-check-label" for="male">
                                    Male
                                </label>

                            </div>


                            <div class="form-check form-check-inline">

                                <input class="form-check-input" type="radio" name="gender" id="gender" value="Female">

                                <label class="form-check-label" for="female">
                                    Female
                                </label>

                            </div>


                            <div class="form-check form-check-inline">

                                <input class="form-check-input" type="radio" name="gender" id="gender" value="Other">

                                <label class="form-check-label" for="other">
                                    Other
                                </label>

                            </div>

                        </div>
                        <span id="genderError" class="error"></span>
                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Hobby
                        </label>

                        <div class="hobby-container">

                            <div class="form-check">

                                <input class="form-check-input" type="checkbox" name="hobby" id="hobby" value="reading">

                                <label class="form-check-label" for="reading">
                                    Reading
                                </label>

                            </div>
                            <div class="form-check">

                                <input class="form-check-input" type="checkbox" name="hobby" id="hobby" value="drawing">

                                <label class="form-check-label" for="drawing">
                                    Drawing
                                </label>

                            </div>
                            <div class="form-check">

                                <input class="form-check-input" type="checkbox" name="hobby" id="hobby" value="gaming">

                                <label class="form-check-label" for="gaming">
                                    Gaming
                                </label>

                            </div>
                            <div class="form-check">

                                <input class="form-check-input" type="checkbox" name="hobby" id="hobby" value="travelling">

                                <label class="form-check-label" for="travelling">
                                    Travelling
                                </label>

                            </div>
                            <div class="form-check">

                                <input class="form-check-input" type="checkbox" name="hobby" id="hobby" value="other">

                                <label class="form-check-label" for="otherHobby">
                                    Other
                                </label>

                            </div>

                        </div>
                        <span id="hobbyError" class="error"></span>
                    </div>

                    <div class="mb-4">

                        <label for="city" class="form-label">
                                City
                            </label>

                        <select id="city" class="form-select">

                                <option value="">
                                    Select your city
                                </option>

                                <option value="surat">
                                    Surat
                                </option>

                                <option value="ahmedabad">
                                    Ahmedabad
                                </option>

                                <option value="vadodara">
                                    Vadodara
                                </option>

                                <option value="mumbai">
                                    Mumbai
                                </option>

                                <option value="kolkata">
                                    Kolkata
                                </option>

                            </select>
                        <span id="cityError" class="error"></span>
                    </div>

                    <div class="mb-4">

                        <label for="about" class="form-label">
                            About
                        </label>

                        <textarea class="form-control about-box" id="about" placeholder="Enter your complete address"></textarea>
                        <span id="aboutError" class="error"></span>
                    </div>

                    <button type="submit" id="submit_btn" class="btn submit-btn w-100">
                        Submit
                    </button>

                </form>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
