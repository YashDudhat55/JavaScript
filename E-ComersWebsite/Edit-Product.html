<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/Edit-Product.css">
    
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">

        <div class="container-fluid">

            <a class="navbar-brand" href="index.html">
                E-Comerce
            </a>

            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarScroll">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarScroll">

                <ul class="navbar-nav me-auto my-2 my-lg-0">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="View-Products.html">
                            View Products
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="Add-Product.html">
                            Add Product
                        </a>
                    </li>

                </ul>

                <form class="d-flex">

                    <input class="form-control me-2"
                        type="search"
                        placeholder="Search">

                    <button class="btn btn-outline-success">
                        Search
                    </button>

                </form>

            </div>

        </div>

    </nav>


    <!-- Edit Product -->

    <div class="container mt-5">

        <div class="form-container">

            <h2 class="text-center mb-4">
                Edit Product
            </h2>


            <form id="productForm">


                <!-- Product Name -->

                <div class="mb-3">

                    <label for="ProductName" class="form-label">
                        Product Name
                    </label>

                    <input type="text"
                        class="form-control"
                        id="ProductName">

                    <span id="productNameError"
                        class="error text-danger">
                    </span>

                </div>


                <!-- Category -->

                <div class="mb-3">

                    <label for="Category" class="form-label">
                        Category
                    </label>

                    <input type="text"
                        class="form-control"
                        id="Category">

                    <span id="categoryError"
                        class="error text-danger">
                    </span>

                </div>


                <!-- Price -->

                <div class="mb-3">

                    <label for="Price" class="form-label">
                        Price
                    </label>

                    <input type="number"
                        class="form-control"
                        id="Price">

                    <span id="priceError"
                        class="error text-danger">
                    </span>

                </div>


                <!-- Quantity -->

                <div class="mb-3">

                    <label for="Quantity" class="form-label">
                        Quantity
                    </label>

                    <input type="number"
                        class="form-control"
                        id="Quantity">

                    <span id="quantityError"
                        class="error text-danger">
                    </span>

                </div>


                <!-- Brand -->

                <div class="mb-3">

                    <label for="Brand" class="form-label">
                        Brand
                    </label>

                    <input type="text"
                        class="form-control"
                        id="Brand">

                    <span id="brandError"
                        class="error text-danger">
                    </span>

                </div>


                <!-- Image Link -->

                <div class="mb-3">

                    <label for="Image" class="form-label">
                        Link
                    </label>

                    <input type="text"
                        class="form-control"
                        id="Image">

                    <span id="imageError"
                        class="error text-danger">
                    </span>

                </div>


                <!-- Description -->

                <div class="mb-3">

                    <textarea
                        class="form-control"
                        id="ProductDescription"
                        rows="4"
                        placeholder="Product Description"></textarea>

                    <span id="descriptionError"
                        class="error text-danger">
                    </span>

                </div>


                <!-- Product Colors -->

                <div class="mb-3">

                    <label class="form-label">
                        Product Colors
                    </label>

                    <div class="color-options">


                        <div class="color-item">

                            <input type="checkbox"
                                name="colors"
                                value="Black"
                                id="black">

                            <span class="color-circle black"></span>

                            <label for="black">
                                Black
                            </label>

                        </div>


                        <div class="color-item">

                            <input type="checkbox"
                                name="colors"
                                value="White"
                                id="white">

                            <span class="color-circle white"></span>

                            <label for="white">
                                White
                            </label>

                        </div>


                        <div class="color-item">

                            <input type="checkbox"
                                name="colors"
                                value="Green"
                                id="green">

                            <span class="color-circle green"></span>

                            <label for="green">
                                Green
                            </label>

                        </div>


                        <div class="color-item">

                            <input type="checkbox"
                                name="colors"
                                value="Blue"
                                id="blue">

                            <span class="color-circle blue"></span>

                            <label for="blue">
                                Blue
                            </label>

                        </div>


                        <div class="color-item">

                            <input type="checkbox"
                                name="colors"
                                value="Red"
                                id="red">

                            <span class="color-circle red"></span>

                            <label for="red">
                                Red
                            </label>

                        </div>


                        <div class="color-item">

                            <input type="checkbox"
                                name="colors"
                                value="Yellow"
                                id="yellow">

                            <span class="color-circle yellow"></span>

                            <label for="yellow">
                                Yellow
                            </label>

                        </div>


                        <div class="color-item">

                            <input type="checkbox"
                                name="colors"
                                value="Golden"
                                id="golden">

                            <span class="color-circle golden"></span>

                            <label for="golden">
                                Golden
                            </label>

                        </div>

                    </div>


                    <span id="colorError"
                        class="error text-danger">
                    </span>

                </div>


                <!-- Button -->

                <div class="mt-4">

                    <button type="submit"
                        class="btn btn-primary">

                        Update Product

                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <script src="js/Edit-Product.js"></script>

</body>

</html>
