<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-ComerceWebsite</title>

    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">E-Comerce</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarScroll"
                aria-controls="navbarScroll" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarScroll">
                <ul class="navbar-nav me-auto my-2 my-lg-0 navbar-nav-scroll" style="--bs-scroll-height: 100px;">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link " aria-current="page" href="View-Products.html">View Products</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="Add-Product.html">Add Product</a>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>
    <!-- Form -->

    <form>
        <div class="container">

            <h1>Add Product</h1>
            <div class="col-6 mt-5  ">
                <div class="mb-3">
                    <label for="ProductName" class="form-label">Product Name</label>
                    <input type="text" class="form-control" id="ProductName" aria-describedby="emailHelp">
                </div>
                <div class="mb-3">
                    <label for="Category" class="form-label">Category</label>
                    <input type="text" class="form-control" id="Category">
                </div>
                <div class="mb-3">
                    <label for="Price" class="form-label">Price</label>
                    <input type="number" class="form-control" id="Price">
                </div>
                <div class="mb-3">
                    <label for="Quantity" class="form-label">Quantity</label>
                    <input type="number" class="form-control" id="Quantity">
                </div>
                <div class="mb-3">
                    <label for="Brand" class="form-label">Brand</label>
                    <input type="text" class="form-control" id="Brand">
                </div>
                <div class="mb-3 mt-3">
                    <label for="Quantity" class="form-label">Quantity</label>
                    <input type="number" class="form-control" id="Quantity">
                </div>

                <div class="mb-3 mt-3">
                    <label for="Image" class="form-label">Image</label>
                    <input class="form-control" type="file" id="Image">
                </div>
                <div class="form-floating">
                    <textarea class="form-control" placeholder="Enter product description here" id="ProductDescription"
                        style="height: 100px"></textarea>
                    <label for="ProductDescription">Product Description</label>
                </div>
                <div class="col-12">

                    <label class="form-label">Product Colors</label>

                    <div class="color-options">

                        <label class="color-item">
                            <input type="checkbox" name="colors" value="Black">
                            <span class="color-box black"></span>
                            <span>Black</span>
                        </label>

                        <label class="color-item">
                            <input type="checkbox" name="colors" value="White">
                            <span class="color-box white"></span>
                            <span>White</span>
                        </label>

                        <label class="color-item">
                            <input type="checkbox" name="colors" value="Green">
                            <span class="color-box green"></span>
                            <span>Green</span>
                        </label>

                        <label class="color-item">
                            <input type="checkbox" name="colors" value="Blue">
                            <span class="color-box blue"></span>
                            <span>Blue</span>
                        </label>

                        <label class="color-item">
                            <input type="checkbox" name="colors" value="Red">
                            <span class="color-box red"></span>
                            <span>Red</span>
                        </label>

                        <label class="color-item">
                            <input type="checkbox" name="colors" value="Yellow">
                            <span class="color-box yellow"></span>
                            <span>Yellow</span>
                        </label>

                    </div>

                    <span id="colorError" class="error"></span>

                </div>


                <button type="submit" class="btn btn-primary">+ Add Product</button>
            </div>
        </div>
    </form>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
